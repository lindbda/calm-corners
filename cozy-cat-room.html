<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A cozy calm-down room full of cats: pet them to hear them purr, dangle yarn, turn the lamp down, breathe along with Mochi.">
<title>Cozy Cat Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Layout: one full-bleed lamplit room at night (window, shelf, rug, cardboard box, four cats); name top-left, timer top-right, tool dock floating at the bottom */
:root{
  --room:#1d1730;
  --ink:#f4eef6;
  --mist:#c0b5cc;
  --lamp:#f3c97a;
  --lamp-ink:#22160a;
  --blush:#f4a9ba;
  --glass:rgba(30,22,46,.68);
  --glass-hi:rgba(244,238,246,.08);
  --line:rgba(244,238,246,.16);
  --f-display:'Fredoka', ui-rounded, 'Nunito', system-ui, sans-serif;
  --f-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0; overflow:hidden; background:var(--room); color:var(--ink);
  font-family:var(--f-body); font-size:15px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
}
#stage{position:fixed; inset:0; touch-action:none; cursor:pointer}
#room{position:absolute; inset:0; width:100%; height:100%; display:block}

.brand{
  position:fixed; pointer-events:none;
  top:calc(env(safe-area-inset-top, 0px) + 18px);
  left:calc(env(safe-area-inset-left, 0px) + 22px);
  text-shadow:0 1px 12px rgba(0,0,0,.6);
}
.brand h1{margin:0; font-family:var(--f-display); font-weight:500; font-size:clamp(24px, 2.6vw, 36px); line-height:1}
.brand p{margin:.45em 0 0; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--mist)}

.timer-pill{
  position:fixed; display:flex; align-items:center; gap:10px;
  top:calc(env(safe-area-inset-top, 0px) + 16px);
  right:calc(env(safe-area-inset-right, 0px) + 18px);
  padding:8px 16px 8px 8px; border-radius:999px;
  background:var(--glass); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  font-family:var(--f-display); font-size:22px; font-weight:500; font-variant-numeric:tabular-nums;
}
.timer-pill svg{width:34px; height:34px; transform:rotate(-90deg)}
.timer-pill circle{fill:none; stroke-width:3.2}
.timer-pill .track{stroke:var(--line)}
.timer-pill .arc{stroke:var(--lamp); stroke-linecap:round; stroke-dasharray:94.25; stroke-dashoffset:0; transition:stroke-dashoffset .4s linear}

.breath-panel{
  position:fixed; left:0; right:0; margin-inline:auto; width:max-content; max-width:calc(100vw - 32px);
  top:calc(env(safe-area-inset-top, 0px) + 16px);
  display:grid; justify-items:center; gap:2px; padding:12px 28px 14px; box-sizing:border-box;
  border-radius:22px; background:var(--glass); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  pointer-events:none; text-align:center;
}
.phase{margin:0; font-family:var(--f-display); font-weight:500; font-size:clamp(24px, 3.4vw, 40px); line-height:1.05}
.count{margin:0; font-family:var(--f-display); font-weight:600; font-size:clamp(36px, 5vw, 60px); line-height:1; color:var(--lamp); font-variant-numeric:tabular-nums}
.cycle{margin:0; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--mist)}

.hint{
  position:fixed; left:0; right:0; margin-inline:auto; width:max-content; max-width:calc(100vw - 32px);
  top:calc(env(safe-area-inset-top, 0px) + 22%);
  display:grid; justify-items:center; gap:4px; text-align:center; pointer-events:none;
  padding:10px 18px; border-radius:16px; background:rgba(20,14,34,.55);
  text-shadow:0 2px 14px rgba(0,0,0,.8);
  transition:opacity .9s ease, transform .9s ease;
}
.hint strong{font-family:var(--f-display); font-weight:500; font-size:clamp(20px, 2.4vw, 28px)}
.hint span{color:var(--mist); font-size:14px}
.hint.gone{opacity:0; transform:translateY(10px)}
body.breathing .hint, body.sheet-open .hint{opacity:0}

#dock{
  position:fixed; left:0; right:0; margin-inline:auto; width:max-content;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  display:flex; flex-wrap:wrap; justify-content:center; gap:3px; padding:7px;
  max-width:calc(100vw - 32px); box-sizing:border-box;
  border-radius:24px; background:var(--glass); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(16px) saturate(1.2); backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}
.tool{
  appearance:none; border:0; background:transparent; color:var(--ink); font:inherit;
  display:grid; justify-items:center; gap:5px; min-width:62px; padding:10px 6px 8px;
  border-radius:17px; cursor:pointer; font-size:12.5px; letter-spacing:.02em;
  transition:background-color .2s ease, color .2s ease;
}
.tool svg{width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tool:hover{background:var(--glass-hi)}
.tool[aria-pressed="true"]{background:var(--lamp); color:var(--lamp-ink)}
.tool:focus-visible, .pattern:focus-visible, .chip:focus-visible, .coat:focus-visible, .btn:focus-visible, .link:focus-visible{outline:2px solid var(--lamp); outline-offset:2px}
#btnSound .off{display:none}
#btnSound[aria-pressed="false"] .on{display:none}
#btnSound[aria-pressed="false"] .off{display:inline}

.sheet{
  position:fixed; left:0; right:0; margin-inline:auto;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 108px);
  width:min(640px, calc(100vw - 32px)); box-sizing:border-box; padding:18px;
  max-height:calc(100% - 190px); overflow-y:auto;
  border-radius:22px; background:var(--glass); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(1.2); backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 14px 50px rgba(0,0,0,.45);
  animation:rise .28s ease both;
}
@keyframes rise{from{opacity:.4; transform:translateY(8px)} to{opacity:1; transform:none}}
.sheet-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px}
.sheet h2{margin:0; font-family:var(--f-display); font-weight:500; font-size:20px}
.link{appearance:none; border:0; background:none; color:var(--lamp); font:inherit; font-size:14px; cursor:pointer; padding:4px 6px; border-radius:8px}
.patterns{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px}
.pattern, .chip, .coat{
  appearance:none; font:inherit; color:var(--ink); cursor:pointer;
  border-radius:16px; border:1.5px solid var(--line); background:var(--glass-hi);
  transition:border-color .2s ease, background-color .2s ease;
}
.pattern{text-align:left; display:grid; gap:4px; align-content:start; padding:14px; min-width:0}
.pattern:hover, .chip:hover, .coat:hover{border-color:rgba(243,201,122,.5)}
.pattern[aria-pressed="true"], .coat[aria-pressed="true"]{border-color:var(--lamp); background:rgba(243,201,122,.12)}
.p-name{font-family:var(--f-display); font-weight:500; font-size:20px}
.p-rhythm{font-size:13px; color:var(--lamp); font-variant-numeric:tabular-nums; letter-spacing:.03em}
.p-note{font-size:13.5px; line-height:1.4; color:var(--mist)}
.chips{display:flex; flex-wrap:wrap; gap:10px}
.chip{flex:1 1 90px; padding:16px 10px; font-family:var(--f-display); font-size:22px; font-weight:500}
.chip small{display:block; font-family:var(--f-body); font-size:12px; color:var(--mist); font-weight:400; margin-top:2px}

.cat-sheet{display:grid; grid-template-columns:150px minmax(0, 1fr); gap:18px; align-items:start}
#catPreview{width:150px; height:170px; border-radius:18px; background:radial-gradient(circle at 50% 60%, rgba(243,201,122,.22), rgba(243,201,122,0) 70%)}
.name-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.name-row label{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--mist)}
#catName{
  flex:1 1 180px; min-width:0; box-sizing:border-box;
  font-family:var(--f-display); font-size:24px; font-weight:500; color:var(--ink);
  background:var(--glass-hi); border:1.5px solid var(--line); border-radius:14px; padding:9px 14px;
  -webkit-user-select:text; user-select:text;
}
#catName:focus-visible{outline:2px solid var(--lamp); outline-offset:2px}
.coats{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px}
.coat{display:flex; align-items:center; gap:10px; padding:9px 11px; text-align:left; font-size:15px}
.swatch{flex:none; width:26px; height:26px; border-radius:50%; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}

.done{position:fixed; inset:0; display:grid; place-items:center; background:rgba(8,5,18,.5); padding-inline:16px}
.done-card{
  width:min(460px, 100%); box-sizing:border-box; padding:28px; border-radius:26px; text-align:center;
  background:var(--glass); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  animation:rise .4s ease both;
}
.done-card h2{margin:0 0 10px; font-family:var(--f-display); font-weight:500; font-size:30px; text-wrap:balance}
.done-card p{margin:0 auto 22px; max-width:32ch; color:var(--mist); font-size:16px; line-height:1.5}
.done-card .heart{color:var(--blush)}
.done-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.btn{
  appearance:none; font:inherit; cursor:pointer; padding:13px 22px; border-radius:14px; border:1.5px solid var(--lamp);
  background:var(--lamp); color:var(--lamp-ink); font-weight:700; font-size:16px;
}
.btn.ghost{background:transparent; color:var(--ink); border-color:var(--line)}

@media (max-width:600px){
  .tool{min-width:44px; padding:9px 2px 7px; font-size:10.5px}
  .tool svg{width:22px; height:22px}
  #btnFull{display:none}
  .patterns{grid-template-columns:1fr}
  .pattern{grid-template-columns:auto 1fr; column-gap:12px; align-items:baseline}
  .p-note{grid-column:1 / -1}
  .cat-sheet{grid-template-columns:1fr}
  #catPreview{width:110px; height:124px; justify-self:center}
  .coats{grid-template-columns:1fr 1fr}
  .sheet{bottom:calc(env(safe-area-inset-bottom, 0px) + 96px)}
  .breath-panel{top:calc(env(safe-area-inset-top, 0px) + 76px); padding:10px 22px 12px}
}
@media (prefers-reduced-motion:reduce){
  .sheet, .done-card{animation:none}
  .hint, .tool{transition:none}
}
</style>

<div id="stage" role="application" aria-label="A cozy room with four cats. Touch a cat to pet it. Touch anywhere else to drop a ball of yarn; hold and drag to dangle it.">
  <canvas id="room"></canvas>
</div>

<header class="brand">
  <h1>Cozy Cat Room</h1>
  <p id="brandSub">Mochi's calm corner</p>
</header>

<div id="timerPill" class="timer-pill" hidden>
  <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15"/><circle id="timerArc" class="arc" cx="18" cy="18" r="15"/></svg>
  <span id="timerText">3:00</span>
</div>

<div id="breath" class="breath-panel" hidden aria-live="polite">
  <p class="phase" id="phase">Breathe in</p>
  <p class="count" id="count">1</p>
  <p class="cycle" id="cycle">Breath 1 with Mochi</p>
</div>

<div id="hint" class="hint">
  <strong id="hintMain">Pet a cat, or tap to drop some yarn</strong>
  <span>Hold and drag to dangle it. Every bounce plays a note.</span>
</div>

<section id="sheet" class="sheet" hidden aria-label="Options">
  <div id="sheetBreath" hidden>
    <div class="sheet-head">
      <h2 id="breathTitle">Breathe with Mochi</h2>
      <button class="link" id="breathStop" hidden>Stop breathing</button>
    </div>
    <div class="patterns">
      <button class="pattern" id="patBalloon" data-pattern="balloon" aria-pressed="false">
        <span class="p-name">Balloon</span><span class="p-rhythm">In 4 · Out 5</span>
        <span class="p-note">Fill up slowly, then let the air out. A good place to start.</span>
      </button>
      <button class="pattern" id="patSquare" data-pattern="square" aria-pressed="false">
        <span class="p-name">Square</span><span class="p-rhythm">In 4 · Hold 4 · Out 4 · Rest 4</span>
        <span class="p-note">Trace the four sides of a box. Cats love boxes.</span>
      </button>
      <button class="pattern" id="patSleepy" data-pattern="sleepy" aria-pressed="false">
        <span class="p-name">Sleepy cat</span><span class="p-rhythm">In 4 · Hold 7 · Out 8</span>
        <span class="p-note">A long, slow breath out, like a cat settling in for a nap.</span>
      </button>
    </div>
  </div>
  <div id="sheetTimer" hidden>
    <div class="sheet-head">
      <h2>Calm time</h2>
      <button class="link" id="timerStop" hidden>Stop timer</button>
    </div>
    <div class="chips">
      <button class="chip" id="chip1" data-min="1">1<small>minute</small></button>
      <button class="chip" id="chip2" data-min="2">2<small>minutes</small></button>
      <button class="chip" id="chip3" data-min="3">3<small>minutes</small></button>
      <button class="chip" id="chip5" data-min="5">5<small>minutes</small></button>
    </div>
  </div>
  <div id="sheetCat" hidden>
    <div class="cat-sheet">
      <canvas id="catPreview" aria-hidden="true"></canvas>
      <div>
        <div class="sheet-head"><h2>Your cat</h2></div>
        <div class="name-row">
          <label for="catName">Name</label>
          <input id="catName" type="text" maxlength="16" autocomplete="off" spellcheck="false" value="Mochi">
        </div>
        <div class="coats" id="coats"></div>
      </div>
    </div>
  </div>
</section>

<nav id="dock" aria-label="Calm tools">
  <button class="tool" id="btnBreath" aria-pressed="false" title="Breathing guide (B)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="8.4" stroke-dasharray="2.2 3"/></svg>
    <span>Breathe</span>
  </button>
  <button class="tool" id="btnTimer" aria-pressed="false" title="Calm timer (T)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.6l2.4 1.8M9.5 3h5"/></svg>
    <span>Timer</span>
  </button>
  <button class="tool" id="btnCat" aria-pressed="false" title="Name and color your cat (C)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 4.2l3.6 3.9a8.6 8.6 0 0 1 7.6 0l3.6-3.9.5 8c0 4.2-3.6 7.6-7.9 7.6S4.1 16.4 4.1 12.2z"/><path d="M9.2 12.6h.01M14.8 12.6h.01" stroke-width="2.6"/></svg>
    <span>My cat</span>
  </button>
  <button class="tool" id="btnRain" aria-pressed="false" title="Rain on the window (R)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5c0 2-2.2 3.3-2.2 5.1a2.2 2.2 0 0 0 4.4 0c0-1.8-2.2-3.1-2.2-5.1zM16.5 8c0 2.2-2.6 3.8-2.6 6a2.6 2.6 0 0 0 5.2 0c0-2.2-2.6-3.8-2.6-6z"/><path d="M4 20h7M14 20.5h6"/></svg>
    <span>Rain</span>
  </button>
  <button class="tool" id="btnLamp" aria-pressed="true" title="Lamp on or off (L)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8l3.2 8H4.8z"/><path d="M12 11.5v8.5M8.5 20.5h7"/></svg>
    <span>Lamp</span>
  </button>
  <button class="tool" id="btnHum" aria-pressed="false" title="Background music (H)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.5"/><circle cx="6.8" cy="17.6" r="2.3"/><circle cx="16.8" cy="15.6" r="2.3"/></svg>
    <span>Music</span>
  </button>
  <button class="tool" id="btnSound" aria-pressed="true" title="Sound on or off (M)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.4L12 5.8v12.4l-4.6-3.7H4z"/><path class="on" d="M15.4 9.2a4 4 0 0 1 0 5.6M18 6.6a7.6 7.6 0 0 1 0 10.8"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    <span id="soundLabel">Sound</span>
  </button>
  <button class="tool" id="btnFull" title="Full screen (F)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span>Full screen</span>
  </button>
</nav>

<div id="done" class="done" hidden role="dialog" aria-modal="true" aria-labelledby="doneTitle">
  <div class="done-card">
    <h2 id="doneTitle">Calm time is done</h2>
    <p><span id="doneName">Mochi</span> and friends are proud of you <span class="heart" aria-hidden="true">♥</span><br>Notice how your body feels now.</p>
    <div class="done-actions">
      <button class="btn ghost" id="doneMore">1 more minute</button>
      <button class="btn" id="doneOk">I'm ready</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const store = {
  get(k, d) { try { const v = localStorage.getItem('cozycat.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cozycat.' + k, JSON.stringify(v)); } catch (e) {} }
};
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const stage = $('#stage'), cv = $('#room'), c = cv.getContext('2d');
let W = 1, H = 1, DPR = 1, T = 0;
const L = {};
const bgCv = document.createElement('canvas'), bg = bgCv.getContext('2d');
const winCv = document.createElement('canvas'), wl = winCv.getContext('2d');
const skyCv = document.createElement('canvas'), sk = skyCv.getContext('2d');

/* ───────────── Coats ───────────── */
const COATS = {
  orange:  { label: 'Orange tabby', base: '#e8923f', shade: '#b9631f', hi: '#f8cf9a', mark: '#a9521a', eye: '#a6cf5c', nose: '#e98f8f', line: '#5a2e12', ear: '#eba7ae', tabby: true,
             swatch: 'repeating-linear-gradient(60deg,#e8923f 0 5px,#a9521a 5px 8px)' },
  gray:    { label: 'Gray tabby', base: '#9399a1', shade: '#62686f', hi: '#cfd3d8', mark: '#50555c', eye: '#e2b13c', nose: '#d98e96', line: '#2e3136', ear: '#d9a0a8', tabby: true,
             swatch: 'repeating-linear-gradient(60deg,#9399a1 0 5px,#50555c 5px 8px)' },
  black:   { label: 'Black', base: '#2e2a33', shade: '#18161b', hi: '#4c4753', eye: '#ecc94b', nose: '#5a4a52', line: '#a8a2ae', ear: '#6e4f5c', whisker: 'rgba(255,255,255,0.7)', dark: true,
             swatch: '#2e2a33' },
  tuxedo:  { label: 'Tuxedo', base: '#2e2a33', shade: '#18161b', hi: '#4c4753', eye: '#a6cf5c', nose: '#e3a0aa', line: '#a8a2ae', ear: '#7a5563', white: '#f4f1ec', whisker: 'rgba(255,255,255,0.75)', dark: true,
             swatch: 'linear-gradient(135deg,#2e2a33 55%,#f4f1ec 55%)' },
  calico:  { label: 'Calico', base: '#f4efe6', shade: '#cfc4b4', hi: '#ffffff', eye: '#d9a73a', nose: '#e98f9a', line: '#4a4046', ear: '#eba7ae', patches: ['#e08a3c', '#2c2a2f'],
             swatch: 'conic-gradient(#e08a3c 0 120deg,#f4efe6 0 240deg,#2c2a2f 0)' },
  white:   { label: 'Snowy white', base: '#f6f2ec', shade: '#cfc7bd', hi: '#ffffff', eye: '#7fb6e6', nose: '#eda2ad', line: '#6b6168', ear: '#f0b3bb',
             swatch: '#f6f2ec' },
  siamese: { label: 'Siamese', base: '#efe2cc', shade: '#c9b38e', hi: '#fbf3e4', eye: '#6aa8e8', nose: '#6a4d3d', line: '#3b2a20', ear: '#4a362a', points: '#5b4334',
             swatch: 'radial-gradient(circle at 50% 40%,#efe2cc 45%,#5b4334 78%)' }
};

/* ───────────── Cats ───────────── */
function makeCat(id, pose, coat, pitch) {
  return { id, pose, coat, pitch, x: 0, y: 0, s: 50, hx: 0, hy: 0,

  rainFx.level += ((rain.on ? 1 : 0) - rainFx.level) * Math.min(1, dt * 0.8);
  updateBreath(dt);
  updateTimer();
  updateBalls(dt);
  for (const k of cats) updateCat(k, dt);
  setPurr(Math.max(...cats.map((k) => k.purr)));

  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.drawImage(bgCv, 0, 0, W, H);
  drawWindow(c, dt);
  c.drawImage(winCv, 0, 0, W, H);
  drawLampShade(c);
  roomDark(c);
  drawCat(c, shelfCat, shelfCat.x, shelfCat.y, shelfCat.s);
  drawCat(c, sill, sill.x, sill.y, sill.s);
  drawBoxAndKitten(c);
  drawBreathRing(c);
  const behind = balls.filter((b) => !b.held && b.gy < main.y);
  const front = balls.filter((b) => !b.held && b.gy >= main.y);
  for (const b of behind) drawBall(c, b);
  drawCat(c, main, main.x, main.y, main.s);
  for (const b of front) drawBall(c, b);
  for (const b of balls) if (b.held) drawBall(c, b);
  drawParticles(c, dt);
  lampGlow(c);

  if (sheetOpen === 'cat' && prev.width > 0) {
    pctx.setTransform(1, 0, 0, 1, 0, 0); pctx.clearRect(0, 0, prev.width, prev.height);
    const pw = prev.width / DPR, ph = prev.height / DPR;
    pctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawCat(pctx, main, pw / 2, ph - 10, ph / 2.45);
  }
}
requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
